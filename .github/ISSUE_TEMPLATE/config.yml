blank_issues_enabled: false
contact_links:
  - name: HADES community support
    url: https://discord.gg/BpEGzWwGYf
    about: Ask non-sensitive setup questions and compare notes with the community.
  - name: Report a security vulnerability privately
    url: https://github.com/scottgigawatt/scripts/security/advisories/new
    about: Keep security details and credential exposure out of public issues.
