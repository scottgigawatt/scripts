#
# codeql-actions.yml: Analyze workflow and Python source with the sibling security policy.
#

name: "Inspect Code Security 🔎"

#
# Inspect source on pull requests and main without executing utility code.
#
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  #
  # Analyze workflows and Python independently; upload results with scoped permissions.
  #
  codeql-actions:
    name: ${{ matrix.language == 'actions' && 'Analyze GitHub Actions 🛠️' || 'Analyze Python 🐍' }}
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      #
      # Read the PR source without retaining repository write credentials.
      #
      - name: "Open the Source Portal 🌀"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      #
      # Analyze source without running scripts or installing their service dependencies.
      #
      - name: "Initialize CodeQL 🔎"
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      #
      # Upload each language result to its own CodeQL category for review.
      #
      - name: "Report Security Findings 📋"
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          category: "/language:${{ matrix.language }}"
