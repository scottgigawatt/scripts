# .gitleaks.toml: Keep upstream secret detection active with one reviewed exclusion.
#

# A local configuration replaces defaults unless it explicitly extends them.
[extend]
useDefault = true

# The detect-secrets baseline contains scanner fingerprints, not usable credentials.
[allowlist]
description = "Reviewed detect-secrets baseline fingerprints"
paths = ['''(^|/)\.secrets\.baseline$''']
